<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Administrador Simplificado</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <h1>Cadastro de Administrador Simplificado</h1>
    <div id="divMensagemCadAdm"></div>
    <div>
        <form id="formCadAdm">
                <div>
                <label for="txtNome">* Nome Completo:</label>
                <input type="text" id="txtNome" />
            </div>
            <div>
                <label for="txtEmail">* E-mail:</label>
                <input type="email" id="txtEmail"  />
            </div>
            <div>
                <label for="txtSenha">* Senha: </label>
                <input type="password" id="txtSenha" />
            </div>
            <div>
                <button type="submit" id="btnCadastrar" style="margin: 10px;" >Cadastrar</button>
            </div>
        </form>
    </div>
</body>
<script type="module" src="dist/cadAdmSimplificado.js"></script>
</html>
